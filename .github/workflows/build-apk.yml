name: Build TrueWeb APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK
        shell: bash
        run: |
          SDKMANAGER="${ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager"

          yes | "$SDKMANAGER" --licenses >/dev/null || true

          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-37.0" \
            "build-tools;36.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.6.0"

      - name: Unpack TrueWeb
        run: |
          rm -rf buildsrc
          mkdir -p buildsrc
          unzip -q TrueWebAndroid-v0.1.zip -d buildsrc

      - name: Fix Compose compiler
        shell: bash
        run: |
          cat > buildsrc/TrueWebAndroid-v0.1/build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application") version "9.4.0" apply false
              id("org.jetbrains.kotlin.plugin.compose") version "2.3.21" apply false
          }
          EOF

          cat > buildsrc/TrueWebAndroid-v0.1/app/build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.plugin.compose")
          }

          android {
              namespace = "ru.trueweb.vpn"
              compileSdk = 37

              defaultConfig {
                  applicationId = "ru.trueweb.vpn"
                  minSdk = 23
                  targetSdk = 37
                  versionCode = 1
                  versionName = "0.1.0"
              }

              buildFeatures {
                  compose = true
                  buildConfig = true
              }

              packaging {
                  resources.excludes += "/META-INF/{AL2.0,LGPL2.1}"
              }
          }

          dependencies {
              implementation("androidx.core:core-ktx:1.19.0")
              implementation("androidx.activity:activity-compose:1.13.0")

              val composeBom = platform("androidx.compose:compose-bom:2026.08.00")
              implementation(composeBom)
              androidTestImplementation(composeBom)

              implementation("androidx.compose.ui:ui")
              implementation("androidx.compose.ui:ui-tooling-preview")
              implementation("androidx.compose.foundation:foundation")
              implementation("androidx.compose.material3:material3")
              debugImplementation("androidx.compose.ui:ui-tooling")
          }
          EOF

      - name: Build APK
        working-directory: buildsrc/TrueWebAndroid-v0.1
        run: gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TrueWeb-APK
          path: buildsrc/TrueWebAndroid-v0.1/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
