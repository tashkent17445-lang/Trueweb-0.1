name: Build TrueWeb APK v0.4 Xray

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK
        shell: bash
        run: |
          SDKMANAGER="${ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-37.0" \
            "build-tools;36.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.6.0"

      - name: Unpack TrueWeb v0.4
        shell: bash
        run: |
          rm -rf buildsrc
          mkdir -p buildsrc
          unzip -q TrueWebAndroid-v0.4.zip -d buildsrc
          test -f buildsrc/TrueWebAndroid-v0.4/app/build.gradle.kts

      - name: Fix XUDP BaseKey
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path(
              "buildsrc/TrueWebAndroid-v0.4/"
              "app/src/main/java/ru/trueweb/vpn/vpn/TrueWebVpnService.kt"
          )

          s = p.read_text()

          if "import android.util.Base64\n" not in s:
              s = s.replace(
                  "import android.util.Log\n",
                  "import android.util.Log\nimport android.util.Base64\n"
              )

          if "import java.security.MessageDigest\n" not in s:
              s = s.replace(
                  "import java.util.concurrent.atomic.AtomicBoolean\n",
                  "import java.util.concurrent.atomic.AtomicBoolean\n"
                  "import java.security.MessageDigest\n"
              )

          old = """        val base = filesDir.absolutePath
          Libv2ray.initCoreEnv(base, DeviceIdentity(this).hwid)
          core = Libv2ray.newCoreController(callback)
          """

          new = """        val base = filesDir.absolutePath
          val hwid = DeviceIdentity(this).hwid
          val keyBytes = MessageDigest.getInstance("SHA-256")
              .digest(hwid.toByteArray(Charsets.UTF_8))
          val xudpBaseKey = Base64.encodeToString(
              keyBytes,
              Base64.URL_SAFE or Base64.NO_PADDING or Base64.NO_WRAP
          )
          Libv2ray.initCoreEnv(base, xudpBaseKey)
          core = Libv2ray.newCoreController(callback)
          """

          if old not in s:
              raise SystemExit("STOP: initCoreEnv block not found")

          p.write_text(s.replace(old, new, 1))
          print("XUDP BaseKey patch: OK")
          PY

      - name: Download Xray Android core
        shell: bash
        run: |
          mkdir -p buildsrc/TrueWebAndroid-v0.4/app/libs

          curl -fL --retry 3 --retry-delay 2 \
            https://github.com/2dust/AndroidLibXrayLite/releases/download/v26.7.31/libv2ray.aar \
            -o buildsrc/TrueWebAndroid-v0.4/app/libs/libv2ray.aar

          unzip -t \
            buildsrc/TrueWebAndroid-v0.4/app/libs/libv2ray.aar \
            >/dev/null

          unzip -l \
            buildsrc/TrueWebAndroid-v0.4/app/libs/libv2ray.aar \
            | grep -q 'classes.jar'

          unzip -l \
            buildsrc/TrueWebAndroid-v0.4/app/libs/libv2ray.aar \
            | grep -q 'jni/arm64-v8a/'

          echo "libv2ray.aar SHA256: $(sha256sum \
            buildsrc/TrueWebAndroid-v0.4/app/libs/libv2ray.aar \
            | awk '{print $1}')"

      - name: Build APK
        working-directory: buildsrc/TrueWebAndroid-v0.4
        shell: bash
        run: |
          gradle clean :app:assembleDebug \
            --stacktrace \
            --no-daemon \
            --no-build-cache

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TrueWeb-APK-v0.4-Xray
          path: buildsrc/TrueWebAndroid-v0.4/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
