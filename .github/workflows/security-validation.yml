name: Validate security hardening

on:
  push:
    branches:
      - security-hardening-0.9.9
    paths:
      - "android-src/**"
      - ".github/workflows/security-validation.yml"

permissions:
  contents: read

concurrency:
  group: trueweb-security-validation
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Setup Java
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="${ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-37.0" "build-tools;36.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3
        with:
          gradle-version: "9.6.0"

      - name: Download and verify Xray Android core
        shell: bash
        run: |
          set -euo pipefail
          LIBS="android-src/app/libs"
          mkdir -p "$LIBS"
          curl -fL --retry 4 --retry-delay 2 \
            https://github.com/2dust/AndroidLibXrayLite/releases/download/v26.7.31/libv2ray.aar \
            -o "$LIBS/libv2ray.aar"
          echo "a6b51b525b72a114c10e34288392439b1897c9ff7ce2f8afd7ffdce9d91e93b3  $LIBS/libv2ray.aar" | sha256sum -c -

      - name: Download GeoData
        shell: bash
        run: |
          set -euo pipefail
          ASSETS="android-src/app/src/main/assets"
          mkdir -p "$ASSETS"
          curl -fL --retry 4 --retry-delay 2 \
            https://github.com/v2fly/geoip/releases/latest/download/geoip.dat \
            -o "$ASSETS/geoip.dat"
          curl -fL --retry 4 --retry-delay 2 \
            https://github.com/v2fly/domain-list-community/releases/latest/download/dlc.dat \
            -o "$ASSETS/geosite.dat"
          test -s "$ASSETS/geoip.dat"
          test -s "$ASSETS/geosite.dat"

      - name: Compile direct debug
        working-directory: android-src
        shell: bash
        run: |
          set -euo pipefail
          gradle clean :app:assembleDirectDebug --stacktrace --no-daemon --no-build-cache
