name: Unpack TrueWeb Android source

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/unpack-android-source.yml"

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Unpack source archive
        shell: bash
        run: |
          set -euo pipefail

          ARCHIVE="TrueWebAndroid-v0.8.7-windows-settings-source.zip"
          DEST="android-src"
          TMP="$(mktemp -d)"

          test -f "$ARCHIVE"
          unzip -q "$ARCHIVE" -d "$TMP"

          test -d "$TMP/TrueWebAndroid-v0.8.7"

          rm -rf "$DEST"
          mkdir -p "$DEST"
          cp -a "$TMP/TrueWebAndroid-v0.8.7/." "$DEST/"

          rm -rf "$TMP"

          echo "Unpacked source:"
          find "$DEST" -maxdepth 3 -type f | sort | head -200

      - name: Commit unpacked source
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add android-src

          if git diff --cached --quiet; then
            echo "No source changes to commit"
            exit 0
          fi

          git commit -m "Unpack TrueWeb Android v0.8.7 source"
          git push origin HEAD:main
