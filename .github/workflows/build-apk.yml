name: Build TrueWeb APK v0.8.3 Release

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK
        shell: bash
        run: |
          SDKMANAGER="${ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager"

          yes | "$SDKMANAGER" --licenses >/dev/null || true

          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-37.0" \
            "build-tools;36.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.6.0"

      - name: Unpack TrueWeb source
        shell: bash
        run: |
          set -euo pipefail

          rm -rf buildsrc
          mkdir -p buildsrc

          test -f TrueWebAndroid-v0.4.zip

          unzip -q TrueWebAndroid-v0.4.zip -d buildsrc

          test -f buildsrc/TrueWebAndroid-v0.4/app/build.gradle.kts

          echo "TrueWeb source unpacked successfully"

      - name: Download Xray Android core
        shell: bash
        run: |
          set -euo pipefail

          LIBS="buildsrc/TrueWebAndroid-v0.4/app/libs"
          mkdir -p "$LIBS"

          curl -fL \
            --retry 4 \
            --retry-delay 2 \
            https        run: |
          mkdir -p buildsrc/TrueWebAndroid-v0.4/app/libs

          curl -fL --retry 3 --retry-delay 2 \
            https://github.com/2dust/AndroidLibXrayLite/releases/download/v26.7.31/libv2ray.aar \
            -o buildsrc/TrueWebAndroid-v0.4/app/libs/libv2ray.aar

          unzip -t \
            buildsrc/TrueWebAndroid-v0.4/app/libs/libv2ray.aar \
            >/dev/null

          unzip -l \
            buildsrc/TrueWebAndroid-v0.4/app/libs/libv2ray.aar \
            | grep -q 'classes.jar'

          unzip -l \
            buildsrc/TrueWebAndroid-v0.4/app/libs/libv2ray.aar \
            | grep -q 'jni/arm64-v8a/'

      - name: Build APK
        working-directory: buildsrc/TrueWebAndroid-v0.4
        shell: bash
        run: |
          gradle clean :app:assembleDebug \
            --stacktrace \
            --no-daemon \
            --no-build-cache

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TrueWeb-APK-v0.4-Xray
          path: buildsrc/TrueWebAndroid-v0.4/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
