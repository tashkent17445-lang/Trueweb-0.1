name: Build TrueWeb APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK
        shell: bash
        run: |
          SDKMANAGER="${ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-37.0" \
            "build-tools;36.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.6.0"

      - name: Unpack TrueWeb
        run: |
          rm -rf buildsrc
          mkdir -p buildsrc
          unzip -q TrueWebAndroid-v0.1.zip -d buildsrc

      - name: Build APK
        working-directory: buildsrc/TrueWebAndroid-v0.1
        run: gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TrueWeb-APK
          path: buildsrc/TrueWebAndroid-v0.1/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
